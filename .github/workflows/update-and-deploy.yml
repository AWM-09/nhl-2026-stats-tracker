name: Update NHL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate NHL dashboard
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi 'NHL Stats' index.html

      - name: Prepare dashboard files
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
